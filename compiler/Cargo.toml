[package]
name = "xenonc"
version = "0.1.0"
edition = "2024"
description = "Xenon compiler (xenonc)"
license = "MPL-2.0"
publish = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
logos = "0.16.1"
num-bigint = "0.5.1"
num-traits = "0.2"
thiserror = "2.0.18"
ariadne = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
inkwell = { version = "0.10", features = [
    "llvm22-1-force-dynamic",
] }

[target.'cfg(target_os = "macos")'.dependencies]
inkwell = { version = "0.10", features = [
    "llvm22-1",
] }

[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
inkwell = { version = "0.10", features = [
    "llvm22-1",
] }
